name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexhack
          POSTGRES_PASSWORD: lexhack_dev_pw
          POSTGRES_DB: lexhack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexhack -d lexhack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lexhack:lexhack_dev_pw@127.0.0.1:5432/lexhack_test
      NOTIFICATION_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            frontend -> frontend/target
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  frontend:
    name: Frontend (Rust/WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend -> frontend/target
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"
      - working-directory: frontend
        run: cargo fmt -- --check
      - working-directory: frontend
        run: cargo check --all-targets
      - working-directory: frontend
        run: cargo check --target wasm32-unknown-unknown --all-targets
      - working-directory: frontend
        run: cargo clippy --all-targets --all-features -- -D warnings
      - working-directory: frontend
        env:
          API_BASE_URL: http://localhost:3000
        run: trunk build --release

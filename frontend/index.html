<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    /* Apply the saved theme before CSS loads to prevent a flash of the wrong theme. */
    (function () {
        try {
            var saved = localStorage.getItem('lexhack.theme');
            var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (sysDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* ignore */ }
    })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LexGuard — AI-assisted contract risk and deadline management." />
    <meta name="referrer" content="no-referrer" />
    <title>LexGuard</title>

    <!-- Trunk injects the compiled WASM + JS bundle here. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <!-- Design system: single small stylesheet, no CSS framework. -->
    <link data-trunk rel="css" href="styles/main.css" />
</head>
<body>
    <noscript>
        <p style="font-family: system-ui; padding: 1rem;">
            LexGuard requires JavaScript to run. Please enable it and reload.
        </p>
    </noscript>
</body>
</html>

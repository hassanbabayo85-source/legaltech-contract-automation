# =============================================================================
# LexHack — local Docker Compose stack.
#
# Runs three containers:
#
#   * postgres  — PostgreSQL 16 with a persistent volume.
#   * migrate   — one-shot job that runs `sqlx migrate run` and exits.
#   * app       — the backend + frontend bundle, on :3000.
#
# Usage:
#
#     cp .env.example .env
#     # edit .env — set NOTIFICATION_SECRET_KEY and (optionally) AI_API_KEY
#     docker compose up --build
#
# Then open http://localhost:3000.
#
# The `migrate` service runs before `app` starts (Compose's
# `depends_on: condition: service_completed_successfully`).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexhack
      POSTGRES_PASSWORD: lexhack_dev_pw
      POSTGRES_DB: lexhack
    ports:
      - "5432:5432"
    volumes:
      - lexhack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexhack -d lexhack"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lexhack:lexhack_dev_pw@postgres:5432/lexhack
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Migrations: applying from /app/migrations"
        # We do not ship sqlx-cli in the runtime image (it would bloat
        # it). The backend binary is what actually needs the schema; the
        # application itself runs migrations on start via a separate
        # process. For this demo we invoke a tiny Rust helper that is
        # part of the backend binary.
        /usr/local/bin/lexhack-backend --migrate
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://lexhack:lexhack_dev_pw@postgres:5432/lexhack
      HOST: 0.0.0.0
      PORT: 3000
      RUST_LOG: info
      # Generate with: openssl rand -base64 32
      # Placeholder shown for reference — override in a real .env.
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:?NOTIFICATION_SECRET_KEY must be set in .env}
      # Optional. Without it, POST /api/contracts/:id/analyze returns 502.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  lexhack_pgdata:
